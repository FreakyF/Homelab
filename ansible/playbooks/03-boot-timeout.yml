---
- name: Proxmox - Set boot timeout to 0
  hosts: proxmox
  become: true

  tasks:
    - name: Set GRUB timeout to 0
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: "^GRUB_TIMEOUT="
        line: "GRUB_TIMEOUT=0"
      notify: Update grub

  handlers:
    - name: Update grub
      ansible.builtin.command:
        cmd: update-grub
      changed_when: true
