---
- name: Proxmox - Configure repositories
  hosts: proxmox
  become: true

  tasks:
    - name: Disable PVE enterprise repo
      ansible.builtin.deb822_repository:
        name: pve-enterprise
        types: deb
        uris: https://enterprise.proxmox.com/debian/pve
        suites: "{{ debian_suite }}"
        components: pve-enterprise
        signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
        enabled: false

    - name: Ensure PVE no-subscription repo is present
      ansible.builtin.deb822_repository:
        name: proxmox
        types: deb
        uris: http://download.proxmox.com/debian/pve
        suites: "{{ debian_suite }}"
        components: pve-no-subscription
        signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
        enabled: true

    - name: Disable Ceph enterprise repo
      ansible.builtin.deb822_repository:
        name: ceph-enterprise
        types: deb
        uris: https://enterprise.proxmox.com/debian/ceph-squid
        suites: "{{ debian_suite }}"
        components: enterprise
        signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
        enabled: false

    - name: Enable Ceph no-subscription repo
      ansible.builtin.deb822_repository:
        name: ceph-no-subscription
        types: deb
        uris: http://download.proxmox.com/debian/ceph-tentacle
        suites: "{{ debian_suite }}"
        components: no-subscription
        signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
        enabled: true

    - name: Remove old ceph.sources
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/ceph.sources
        state: absent

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
